<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BALIDATAPLUK - Data App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0b5cff;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 8px;
    }

    header p {
      opacity: 0.9;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #0b5cff;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .plans {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .plan {
      border: 2px solid #e1e5eb;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      background: white;
    }

    .plan:hover {
      border-color: #0b5cff;
    }

    .plan strong {
      display: block;
      color: #0b5cff;
      margin-bottom: 5px;
    }

    .plan.selected {
      border-color: #0b5cff;
      background: #eef4ff;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #0b5cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #084dcc;
    }

    .balance {
      background: #111827;
      color: white;
      text-align: center;
      padding: 20px;
      border-radius: 12px;
    }

    .balance strong {
      display: block;
      font-size: 28px;
      margin-top: 8px;
      color: #43ff88;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 450px) {
      .plans {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>BALIDATAPLUK</h1>
    <p>Fast & Easy Data Purchase</p>
  </header>

  <div class="container">

    <div class="card">
      <div class="balance">
        Wallet Balance
        <strong>₦0.00</strong>
      </div>
    </div>

    <div class="card">
      <h2>Buy Data</h2>

      <label for="network">Select Network</label>

      <select id="network">
        <option value="">-- Select Network --</option>
        <option value="MTN">MTN</option>
        <option value="Airtel">Airtel</option>
        <option value="Glo">Glo</option>
        <option value="9mobile">9mobile</option>
      </select>

      <label for="phone">Phone Number</label>

      <input
        type="tel"
        id="phone"
        placeholder="08012345678"
        maxlength="11"
      >

      <label>Select Data Plan</label>

      <div class="plans">

        <div class="plan" onclick="selectPlan(this, '1GB - ₦300')">
          <strong>1GB</strong>
          ₦300
        </div>

        <div class="plan" onclick="selectPlan(this, '2GB - ₦500')">
          <strong>2GB</strong>
          ₦500
        </div>

        <div class="plan" onclick="selectPlan(this, '3GB - ₦700')">
          <strong>3GB</strong>
          ₦700
        </div>

        <div class="plan" onclick="selectPlan(this, '5GB - ₦1,000')">
          <strong>5GB</strong>
          ₦1,000
        </div>

      </div>

      <button onclick="buyData()">Buy Data</button>
    </div>

    <div class="card">
      <h2>How it works</h2>
      <p>1. Select your network.</p>
      <br>
      <p>2. Enter the customer's phone number.</p>
      <br>
      <p>3. Select a data plan.</p>
      <br>
      <p>4. Click Buy Data.</p>
    </div>

  </div>

  <footer>
    © 2026 BALIDATAPLUK. All rights reserved.
  </footer>

  <script>

    let selectedPlan = "";

    function selectPlan(element, plan) {

      document.querySelectorAll(".plan").forEach(function(item) {
        item.classList.remove("selected");
      });

      element.classList.add("selected");

      selectedPlan = plan;
    }

    function buyData() {

      const network = document.getElementById("network").value;
      const phone = document.getElementById("phone").value;

      if (!network) {
        alert("Please select a network.");
        return;
      }

      if (!phone || phone.length !== 11) {
        alert("Please enter a valid 11-digit phone number.");
        return;
      }

      if (!selectedPlan) {
        alert("Please select a data plan.");
        return;
      }

      alert(
        "Order received!\n\n" +
        "Network: " + network + "\n" +
        "Phone: " + phone + "\n" +
        "Plan: " + selectedPlan
      );
    }

  </script>

</body>
</html>
